<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Fotos</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  background:white;

  font-family:Arial,sans-serif;

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:40px 20px;

}

.container{

  width:100%;

  max-width:500px;

  text-align:center;

}

h1{

  font-size:40px;

  font-weight:300;

  margin-bottom:50px;

  letter-spacing:2px;

}

.controls{

  display:flex;

  flex-direction:column;

  gap:24px;

}

.upload-box{

  display:flex;

  flex-direction:column;

  gap:12px;

}

.upload{

  width:100%;
  height:58px;

  border-radius:50px;

  background:black;

  color:white;

  display:flex;

  align-items:center;
  justify-content:center;

  letter-spacing:3px;

  font-size:12px;

  cursor:pointer;

}

input[type=file]{

  display:none;

}

.adjust{

  width:100%;

  accent-color:#750014;

}

.preview{

  width:100%;

  height:240px;

  background:#f3f3f3;

  border-radius:24px;

  overflow:hidden;

  position:relative;

}

.preview img{

  width:100%;
  height:100%;

  object-fit:cover;

  transform:scale(1);

}

.continue{

  width:100%;
  height:58px;

  border:none;

  border-radius:50px;

  background:#750014;

  color:white;

  letter-spacing:3px;

  font-size:12px;

  cursor:pointer;

  margin-top:20px;

}

.hidden{

  display:none;

}

@media(max-width:768px){

  h1{

    font-size:30px;

  }

}

</style>

</head>

<body>

<div class="container">

<h1>Insira suas fotos</h1>

<div class="controls">

  <!-- FOTO 1 -->

  <div class="upload-box">

    <div class="preview">
      <img id="img1">
    </div>

    <label class="upload">

      INSERIR FOTO 1

      <input
        type="file"
        accept="image/*"
        onchange="loadImage(event,'img1')"
      >

    </label>

    <input
      type="range"
      min="1"
      max="2"
      step="0.1"
      value="1"
      class="adjust"
      oninput="zoomImage('img1', this.value)"
    >

  </div>

  <!-- FOTO 2 -->

  <div class="upload-box" id="box2">

    <div class="preview">
      <img id="img2">
    </div>

    <label class="upload">

      INSERIR FOTO 2

      <input
        type="file"
        accept="image/*"
        onchange="loadImage(event,'img2')"
      >

    </label>

    <input
      type="range"
      min="1"
      max="2"
      step="0.1"
      value="1"
      class="adjust"
      oninput="zoomImage('img2', this.value)"
    >

  </div>

  <!-- FOTO 3 -->

  <div class="upload-box" id="box3">

    <div class="preview">
      <img id="img3">
    </div>

    <label class="upload">

      INSERIR FOTO 3

      <input
        type="file"
        accept="image/*"
        onchange="loadImage(event,'img3')"
      >

    </label>

    <input
      type="range"
      min="1"
      max="2"
      step="0.1"
      value="1"
      class="adjust"
      oninput="zoomImage('img3', this.value)"
    >

  </div>

  <!-- BOTÃO -->

  <button class="continue">
    CONTINUAR
  </button>

</div>

</div>

<script>

const selected =
localStorage.getItem('polaroid');

/* POLAROID COM 1 FOTO */

if(selected === 'Polaroid 2'){

  document.getElementById('box2').style.display = 'none';

  document.getElementById('box3').style.display = 'none';

}

/* UPLOAD */

function loadImage(event,id){

  const file = event.target.files[0];

  if(file){

    document.getElementById(id).src =
      URL.createObjectURL(file);

  }

}

/* ZOOM */

function zoomImage(id,value){

  document.getElementById(id).style.transform =
    `scale(${value})`;

}

</script>

</body>

</html>
