<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Editor</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      background:#f5f5f5;

      font-family:Arial, sans-serif;

      min-height:100vh;

      padding:40px 20px;

    }

    .container{

      max-width:1200px;

      margin:0 auto;

      text-align:center;

    }

    h1{

      font-size:42px;

      font-weight:300;

      margin-bottom:50px;

    }

    .editor{

      display:flex;

      flex-direction:column;

      align-items:center;

      gap:40px;

    }

    /* POLAROID */

    .polaroid{

      position:relative;

      width:320px;

    }

    .frame{

      width:100%;

      position:relative;

      z-index:10;

      pointer-events:none;

    }

    /* SLOTS */

    .slot{

      position:absolute;

      overflow:hidden;

      background:#ddd;

    }

    .slot img{

      width:100%;
      height:100%;

      object-fit:cover;

    }

    /* POSIÇÕES */

    .slot1{

      top:34px;
      left:95px;

      width:128px;
      height:78px;

    }

    .slot2{

      top:118px;
      left:95px;

      width:128px;
      height:78px;

    }

    .slot3{

      top:202px;
      left:95px;

      width:128px;
      height:78px;

    }

    /* FOTO ÚNICA */

    .single{

      top:45px;
      left:82px;

      width:155px;
      height:210px;

    }

    /* BOTÕES */

    .controls{

      display:flex;

      flex-direction:column;

      gap:18px;

      align-items:center;

    }

    input[type=file]{

      display:none;

    }

    .upload{

      width:240px;
      height:56px;

      border-radius:50px;

      background:black;

      color:white;

      display:flex;

      align-items:center;
      justify-content:center;

      letter-spacing:3px;

      font-size:12px;

      cursor:pointer;

    }

    .continue{

      width:240px;
      height:56px;

      border:none;

      border-radius:50px;

      background:#750014;

      color:white;

      letter-spacing:3px;

      font-size:12px;

      cursor:pointer;

    }

    @media(max-width:768px){

      h1{

        font-size:30px;

      }

      .polaroid{

        width:270px;

      }

    }

  </style>

</head>

<body>

  <div class="container">

    <h1>Personalize sua polaroid</h1>

    <div class="editor">

      <!-- POLAROID -->

      <div class="polaroid">

        <!-- SLOT 1 -->
        <div class="slot slot1">
          <img id="img1">
        </div>

        <!-- SLOT 2 -->
        <div class="slot slot2">
          <img id="img2">
        </div>

        <!-- SLOT 3 -->
        <div class="slot slot3">
          <img id="img3">
        </div>

        <!-- FRAME -->
        <img src="polaroid1.png" class="frame">

      </div>

      <!-- CONTROLES -->

      <div class="controls">

        <label class="upload">

          FOTO 1

          <input
            type="file"
            accept="image/*"
            onchange="loadImage(event, 'img1')"
          >

        </label>

        <label class="upload">

          FOTO 2

          <input
            type="file"
            accept="image/*"
            onchange="loadImage(event, 'img2')"
          >

        </label>

        <label class="upload">

          FOTO 3

          <input
            type="file"
            accept="image/*"
            onchange="loadImage(event, 'img3')"
          >

        </label>

        <button class="continue">
          CONTINUAR
        </button>

      </div>

    </div>

  </div>

  <script>

    function loadImage(event, id){

      const file = event.target.files[0];

      if(file){

        document.getElementById(id).src =
          URL.createObjectURL(file);

      }

    }

  </script>

</body>

</html>
