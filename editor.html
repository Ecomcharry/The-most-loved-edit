<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Editor</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  background:white;

  font-family:Arial,sans-serif;

  min-height:100vh;

  padding:50px 20px;

}

.container{

  max-width:600px;

  margin:0 auto;

}

h1{

  text-align:center;

  font-size:38px;

  font-weight:300;

  margin-bottom:50px;

}

.photos{

  display:flex;

  flex-direction:column;

  gap:40px;

}

.photo-box{

  display:flex;

  flex-direction:column;

  gap:15px;

}

.preview{

  width:100%;

  height:340px;

  background:#f3f3f3;

  border-radius:24px;

  overflow:hidden;

  position:relative;

}

.preview img{

  position:absolute;

  width:100%;
  height:100%;

  object-fit:cover;

  cursor:grab;

}

.upload{

  width:100%;
  height:58px;

  background:black;

  color:white;

  border-radius:50px;

  display:flex;

  align-items:center;
  justify-content:center;

  letter-spacing:3px;

  font-size:12px;

  cursor:pointer;

}

input[type=file]{

  display:none;

}

.zoom{

  width:100%;

  accent-color:#750014;

}

.button{

  width:100%;
  height:58px;

  border:none;

  border-radius:50px;

  background:#750014;

  color:white;

  letter-spacing:3px;

  font-size:12px;

  cursor:pointer;

  margin-top:40px;

}

.hidden{

  display:none;

}

</style>

</head>

<body>

<div class="container">

<h1>Insira suas fotos</h1>

<div class="photos" id="photosContainer">

  <!-- FOTO 1 -->

  <div class="photo-box">

    <div class="preview">
      <img id="img1">
    </div>

    <label class="upload">

      INSERIR FOTO 1

      <input
        type="file"
        accept="image/*"
        onchange="loadImage(event,'img1')"
      >

    </label>

    <input
      type="range"
      min="1"
      max="3"
      step="0.1"
      value="1"
      class="zoom"
      oninput="zoomImage('img1', this.value)"
    >

  </div>

  <!-- FOTO 2 -->

  <div class="photo-box" id="box2">

    <div class="preview">
      <img id="img2">
    </div>

    <label class="upload">

      INSERIR FOTO 2

      <input
        type="file"
        accept="image/*"
        onchange="loadImage(event,'img2')"
      >

    </label>

    <input
      type="range"
      min="1"
      max="3"
      step="0.1"
      value="1"
      class="zoom"
      oninput="zoomImage('img2', this.value)"
    >

  </div>

  <!-- FOTO 3 -->

  <div class="photo-box" id="box3">

    <div class="preview">
      <img id="img3">
    </div>

    <label class="upload">

      INSERIR FOTO 3

      <input
        type="file"
        accept="image/*"
        onchange="loadImage(event,'img3')"
      >

    </label>

    <input
      type="range"
      min="1"
      max="3"
      step="0.1"
      value="1"
      class="zoom"
      oninput="zoomImage('img3', this.value)"
    >

  </div>

  <!-- FOTO 4 -->

  <div class="photo-box hidden" id="box4">

    <div class="preview">
      <img id="img4">
    </div>

    <label class="upload">

      INSERIR FOTO 4

      <input
        type="file"
        accept="image/*"
        onchange="loadImage(event,'img4')"
      >

    </label>

    <input
      type="range"
      min="1"
      max="3"
      step="0.1"
      value="1"
      class="zoom"
      oninput="zoomImage('img4', this.value)"
    >

  </div>

</div>

<button class="button">
  CONTINUAR
</button>

</div>

<script>

const selected =
localStorage.getItem('polaroid');

/* POLAROID 2 = 1 FOTO */

if(selected === 'Polaroid 2'){

  document.getElementById('box2').style.display = 'none';
  document.getElementById('box3').style.display = 'none';

}

/* POLAROID 4 = 4 FOTOS */

if(selected === 'Polaroid 4'){

  document.getElementById('box4')
    .classList.remove('hidden');

}

/* UPLOAD */

function loadImage(event,id){

  const file = event.target.files[0];

  if(file){

    document.getElementById(id).src =
      URL.createObjectURL(file);

  }

}

/* ZOOM */

function zoomImage(id,value){

  document.getElementById(id).style.transform =
    `scale(${value})`;

}

/* MOVER FOTO */

let active = null;

document.querySelectorAll('.preview img').forEach(img => {

  let isDown = false;

  let offset = [0,0];

  let start = [0,0];

  img.addEventListener('mousedown', e => {

    isDown = true;

    active = img;

    start = [
      e.clientX - offset[0],
      e.clientY - offset[1]
    ];

    img.style.cursor = 'grabbing';

  });

  document.addEventListener('mousemove', e => {

    if(!isDown) return;

    offset = [
      e.clientX - start[0],
      e.clientY - start[1]
    ];

    img.style.left = offset[0] + 'px';
    img.style.top = offset[1] + 'px';

  });

  document.addEventListener('mouseup', () => {

    isDown = false;

    img.style.cursor = 'grab';

  });

});

</script>

</body>

</html>
