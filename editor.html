<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Personalize sua Polaroid</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      width:100%;
      min-height:100vh;

      background:#f5f5f5;

      font-family:Arial, sans-serif;

      padding:50px 20px;

    }

    .container{

      width:100%;
      max-width:1200px;

      margin:0 auto;

      text-align:center;

    }

    h1{

      font-size:42px;

      font-weight:300;

      margin-bottom:60px;

      letter-spacing:2px;

      color:black;

    }

    /* POLAROID */

    .polaroid-wrapper{

      display:flex;

      justify-content:center;

      margin-bottom:50px;

    }

    .polaroid{

      position:relative;

      width:320px;

    }

    .frame{

      width:100%;

      position:relative;

      z-index:5;

      pointer-events:none;

    }

    /* ÁREAS DAS FOTOS */

    .photo-slot{

      position:absolute;

      overflow:hidden;

      z-index:2;

      background:#eaeaea;

    }

    .photo-slot img{

      position:absolute;

      width:100%;

      height:100%;

      object-fit:cover;

      top:0;
      left:0;

      transform:scale(1);

    }

    /* POSIÇÕES POLAROID 1 */

    .slot1{

      top:34px;
      left:94px;

      width:130px;
      height:82px;

    }

    .slot2{

      top:120px;
      left:94px;

      width:130px;
      height:82px;

    }

    .slot3{

      top:206px;
      left:94px;

      width:130px;
      height:82px;

    }

    /* CONTROLES */

    .controls{

      display:flex;

      flex-direction:column;

      align-items:center;

      gap:18px;

    }

    input[type="file"]{

      display:none;

    }

    .upload-btn{

      width:240px;
      height:58px;

      border-radius:50px;

      background:black;

      color:white;

      display:flex;

      align-items:center;
      justify-content:center;

      letter-spacing:4px;

      font-size:12px;

      cursor:pointer;

    }

    .button{

      width:240px;
      height:58px;

      border:none;

      border-radius:50px;

      background:#750014;

      color:white;

      letter-spacing:4px;

      font-size:12px;

      cursor:pointer;

    }

    .helper{

      font-size:14px;

      color:#666;

      margin-top:10px;

    }

    @media(max-width:768px){

      h1{

        font-size:30px;

      }

      .polaroid{

        width:280px;

      }

      .slot1{

        top:30px;
        left:82px;

        width:115px;
        height:72px;

      }

      .slot2{

        top:106px;
        left:82px;

        width:115px;
        height:72px;

      }

      .slot3{

        top:182px;
        left:82px;

        width:115px;
        height:72px;

      }

    }

  </style>

</head>

<body>

  <div class="container">

    <h1>Personalize sua polaroid</h1>

    <!-- POLAROID -->

    <div class="polaroid-wrapper">

      <div class="polaroid">

        <!-- FOTO 1 -->
        <div class="photo-slot slot1">
          <img id="preview1">
        </div>

        <!-- FOTO 2 -->
        <div class="photo-slot slot2">
          <img id="preview2">
        </div>

        <!-- FOTO 3 -->
        <div class="photo-slot slot3">
          <img id="preview3">
        </div>

        <!-- FRAME -->
        <img src="polaroid1.png" class="frame">

      </div>

    </div>

    <!-- CONTROLES -->

    <div class="controls">

      <!-- FOTO 1 -->
      <label class="upload-btn">

        ENVIAR FOTO 1

        <input
          type="file"
          accept="image/*"
          onchange="loadImage(event, 'preview1')"
        >

      </label>

      <!-- FOTO 2 -->
      <label class="upload-btn">

        ENVIAR FOTO 2

        <input
          type="file"
          accept="image/*"
          onchange="loadImage(event, 'preview2')"
        >

      </label>

      <!-- FOTO 3 -->
      <label class="upload-btn">

        ENVIAR FOTO 3

        <input
          type="file"
          accept="image/*"
          onchange="loadImage(event, 'preview3')"
        >

      </label>

      <p class="helper">
        Escolha 3 fotos diferentes para montar sua polaroid
      </p>

      <!-- BOTÃO -->

      <button class="button">
        CONTINUAR
      </button>

    </div>

  </div>

  <script>

    function loadImage(event, previewId){

      const file = event.target.files[0];

      if(file){

        const imageURL = URL.createObjectURL(file);

        document.getElementById(previewId).src = imageURL;

      }

    }

  </script>

</body>

</html>
