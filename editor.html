<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Editor</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  background:white;

  font-family:Arial,sans-serif;

  min-height:100vh;

  padding:40px 20px;

}

.container{

  max-width:500px;

  margin:0 auto;

}

h1{

  text-align:center;

  font-size:34px;

  font-weight:300;

  margin-bottom:40px;

  letter-spacing:1px;

}

.photos{

  display:flex;

  flex-direction:column;

  gap:28px;

}

/* BOX FOTO */

.photo-box{

  display:flex;

  flex-direction:column;

  gap:14px;

}

/* PREVIEW MENOR */

.preview{

  width:100%;

  height:220px;

  background:#f4f4f4;

  border-radius:24px;

  overflow:hidden;

  position:relative;

}

/* FOTO */

.preview img{

  position:absolute;

  top:0;
  left:0;

  width:100%;
  height:100%;

  object-fit:cover;

  cursor:grab;

  touch-action:none;

}

/* BOTÃO */

.upload{

  width:100%;
  height:54px;

  background:black;

  color:white;

  border-radius:50px;

  display:flex;

  align-items:center;
  justify-content:center;

  letter-spacing:3px;

  font-size:11px;

  cursor:pointer;

}

input[type=file]{

  display:none;

}

/* SLIDER */

.zoom{

  width:100%;

  accent-color:#750014;

}

/* CONTINUAR */

.button{

  width:100%;
  height:56px;

  border:none;

  border-radius:50px;

  background:#750014;

  color:white;

  letter-spacing:3px;

  font-size:12px;

  cursor:pointer;

  margin-top:30px;

}

.hidden{

  display:none;

}

/* RESPONSIVO */

@media(max-width:768px){

  body{

    padding:30px 16px;

  }

  h1{

    font-size:28px;

    margin-bottom:30px;

  }

  .preview{

    height:180px;

  }

}

</style>

</head>

<body>

<div class="container">

<h1>Insira suas fotos</h1>

<div class="photos">

  <!-- FOTO 1 -->

  <div class="photo-box">

    <div class="preview">
      <img id="img1">
    </div>

    <label class="upload">

      INSERIR FOTO 1

      <input
        type="file"
        accept="image/*"
        onchange="loadImage(event,'img1')"
      >

    </label>

    <input
      type="range"
      min="1"
      max="3"
      step="0.1"
      value="1"
      class="zoom"
      oninput="zoomImage('img1', this.value)"
    >

  </div>

  <!-- FOTO 2 -->

  <div class="photo-box" id="box2">

    <div class="preview">
      <img id="img2">
    </div>

    <label class="upload">

      INSERIR FOTO 2

      <input
        type="file"
        accept="image/*"
        onchange="loadImage(event,'img2')"
      >

    </label>

    <input
      type="range"
      min="1"
      max="3"
      step="0.1"
      value="1"
      class="zoom"
      oninput="zoomImage('img2', this.value)"
    >

  </div>

  <!-- FOTO 3 -->

  <div class="photo-box" id="box3">

    <div class="preview">
      <img id="img3">
    </div>

    <label class="upload">

      INSERIR FOTO 3

      <input
        type="file"
        accept="image/*"
        onchange="loadImage(event,'img3')"
      >

    </label>

    <input
      type="range"
      min="1"
      max="3"
      step="0.1"
      value="1"
      class="zoom"
      oninput="zoomImage('img3', this.value)"
    >

  </div>

  <!-- FOTO 4 -->

  <div class="photo-box hidden" id="box4">

    <div class="preview">
      <img id="img4">
    </div>

    <label class="upload">

      INSERIR FOTO 4

      <input
        type="file"
        accept="image/*"
        onchange="loadImage(event,'img4')"
      >

    </label>

    <input
      type="range"
      min="1"
      max="3"
      step="0.1"
      value="1"
      class="zoom"
      oninput="zoomImage('img4', this.value)"
    >

  </div>

</div>

<button class="button">
  CONTINUAR
</button>

</div>

<script>

/* DEFINE QUANTIDADE */

const selected =
localStorage.getItem('polaroid');

if(selected === 'Polaroid 2'){

  document.getElementById('box2').style.display = 'none';
  document.getElementById('box3').style.display = 'none';

}

if(selected === 'Polaroid 4'){

  document.getElementById('box4')
    .classList.remove('hidden');

}

/* UPLOAD */

function loadImage(event,id){

  const file = event.target.files[0];

  if(file){

    const img =
      document.getElementById(id);

    img.src =
      URL.createObjectURL(file);

  }

}

/* ZOOM */

function zoomImage(id,value){

  const img =
    document.getElementById(id);

  img.dataset.scale = value;

  updateTransform(img);

}

/* MOVE FOTO */

document.querySelectorAll('.preview img')
.forEach(img => {

  let isDragging = false;

  let startX,startY;

  let currentX = 0;
  let currentY = 0;

  img.dataset.scale = 1;

  function start(e){

    isDragging = true;

    startX =
      (e.touches ? e.touches[0].clientX : e.clientX)
      - currentX;

    startY =
      (e.touches ? e.touches[0].clientY : e.clientY)
      - currentY;

  }

  function move(e){

    if(!isDragging) return;

    e.preventDefault();

    currentX =
      (e.touches ? e.touches[0].clientX : e.clientX)
      - startX;

    currentY =
      (e.touches ? e.touches[0].clientY : e.clientY)
      - startY;

    img.dataset.x = currentX;
    img.dataset.y = currentY;

    updateTransform(img);

  }

  function end(){

    isDragging = false;

  }

  img.addEventListener('mousedown', start);
  img.addEventListener('mousemove', move);
  img.addEventListener('mouseup', end);

  img.addEventListener('touchstart', start);
  img.addEventListener('touchmove', move);
  img.addEventListener('touchend', end);

});

/* TRANSFORM */

function updateTransform(img){

  const scale =
    img.dataset.scale || 1;

  const x =
    img.dataset.x || 0;

  const y =
    img.dataset.y || 0;

  img.style.transform =
    `translate(${x}px, ${y}px) scale(${scale})`;

}

</script>

</body>

</html>
