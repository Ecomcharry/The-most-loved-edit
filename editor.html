<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Editor</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  background:#f5f5f5;

  font-family:Arial,sans-serif;

  min-height:100vh;

  padding:40px 20px;

}

.container{

  max-width:1200px;

  margin:0 auto;

  text-align:center;

}

h1{

  font-size:42px;

  font-weight:300;

  margin-bottom:50px;

}

.editor{

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:40px;

}

/* POLAROID */

.polaroid{

  position:relative;

  width:320px;

}

.frame{

  width:100%;

  position:relative;

  z-index:5;

  pointer-events:none;

}

/* SLOTS */

.slot{

  position:absolute;

  overflow:hidden;

}

.slot img{

  width:100%;
  height:100%;

  object-fit:cover;

  transform:scale(1);

  transition:0.2s;

}

/* POLAROID 3 FOTOS */

.slot1{

  top:34px;
  left:95px;

  width:128px;
  height:78px;

}

.slot2{

  top:118px;
  left:95px;

  width:128px;
  height:78px;

}

.slot3{

  top:202px;
  left:95px;

  width:128px;
  height:78px;

}

/* POLAROID 1 FOTO */

.single{

  top:45px;
  left:82px;

  width:155px;
  height:210px;

}

/* CONTROLES */

.controls{

  display:flex;

  flex-direction:column;

  gap:16px;

  align-items:center;

}

input[type=file]{

  display:none;

}

.upload{

  width:240px;
  height:56px;

  border-radius:50px;

  background:black;

  color:white;

  display:flex;

  align-items:center;
  justify-content:center;

  letter-spacing:3px;

  font-size:12px;

  cursor:pointer;

}

.adjust{

  width:240px;

  accent-color:#750014;

}

.continue{

  width:240px;
  height:56px;

  border:none;

  border-radius:50px;

  background:#750014;

  color:white;

  letter-spacing:3px;

  font-size:12px;

  cursor:pointer;

}

.hidden{

  display:none;

}

@media(max-width:768px){

  h1{

    font-size:30px;

  }

  .polaroid{

    width:270px;

  }

}

</style>

</head>

<body>

<div class="container">

<h1>Personalize sua polaroid</h1>

<div class="editor">

  <!-- POLAROID -->

  <div class="polaroid">

    <!-- FOTO 1 -->
    <div class="slot slot1" id="slot1">
      <img id="img1">
    </div>

    <!-- FOTO 2 -->
    <div class="slot slot2" id="slot2">
      <img id="img2">
    </div>

    <!-- FOTO 3 -->
    <div class="slot slot3" id="slot3">
      <img id="img3">
    </div>

    <!-- FRAME -->
    <img src="" id="frame" class="frame">

  </div>

  <!-- CONTROLES -->

  <div class="controls">

    <!-- FOTO 1 -->

    <label class="upload">

      INSERIR FOTO 1

      <input
        type="file"
        accept="image/*"
        onchange="loadImage(event,'img1')"
      >

    </label>

    <!-- AJUSTE FOTO 1 -->

    <input
      type="range"
      min="1"
      max="2"
      step="0.1"
      value="1"
      class="adjust"
      id="adjust1"
      oninput="zoomImage('img1', this.value)"
    >

    <!-- FOTO 2 -->

    <label class="upload" id="upload2">

      INSERIR FOTO 2

      <input
        type="file"
        accept="image/*"
        onchange="loadImage(event,'img2')"
      >

    </label>

    <!-- AJUSTE FOTO 2 -->

    <input
      type="range"
      min="1"
      max="2"
      step="0.1"
      value="1"
      class="adjust"
      id="adjust2"
      oninput="zoomImage('img2', this.value)"
    >

    <!-- FOTO 3 -->

    <label class="upload" id="upload3">

      INSERIR FOTO 3

      <input
        type="file"
        accept="image/*"
        onchange="loadImage(event,'img3')"
      >

    </label>

    <!-- AJUSTE FOTO 3 -->

    <input
      type="range"
      min="1"
      max="2"
      step="0.1"
      value="1"
      class="adjust"
      id="adjust3"
      oninput="zoomImage('img3', this.value)"
    >

    <!-- CONTINUAR -->

    <button class="continue">
      CONTINUAR
    </button>

  </div>

</div>

</div>

<script>

const selected =
localStorage.getItem('polaroid');

const frame =
document.getElementById('frame');

const upload2 =
document.getElementById('upload2');

const upload3 =
document.getElementById('upload3');

const adjust2 =
document.getElementById('adjust2');

const adjust3 =
document.getElementById('adjust3');

const slot1 =
document.getElementById('slot1');

const slot2 =
document.getElementById('slot2');

const slot3 =
document.getElementById('slot3');

/* POLAROID 1 */

if(selected === 'Polaroid 1'){

  frame.src = 'polaroid1.jpg';

}

/* POLAROID 2 */

if(selected === 'Polaroid 2'){

  frame.src = 'polaroid2.jpg';

  slot1.classList.remove('slot1');

  slot1.classList.add('single');

  slot2.style.display = 'none';
  slot3.style.display = 'none';

  upload2.style.display = 'none';
  upload3.style.display = 'none';

  adjust2.style.display = 'none';
  adjust3.style.display = 'none';

}

/* POLAROID 3 */

if(selected === 'Polaroid 3'){

  frame.src = 'polaroid3.jpg';

}

/* POLAROID 4 */

if(selected === 'Polaroid 4'){

  frame.src = 'polaroid4.jpg';

}

/* UPLOAD */

function loadImage(event,id){

  const file = event.target.files[0];

  if(file){

    document.getElementById(id).src =
      URL.createObjectURL(file);

  }

}

/* AJUSTE */

function zoomImage(id, value){

  document.getElementById(id).style.transform =
    `scale(${value})`;

}

</script>

</body>

</html>
