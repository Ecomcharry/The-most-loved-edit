<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Charmy Letter</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100%;
  min-height:100vh;
  background:black;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

.hero{
  position:relative;
  width:100%;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hero img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

.content{
  position:relative;
  z-index:2;
  padding:20px;
  margin-top:280px;
}

.button{

  display:flex;
  align-items:center;
  justify-content:center;

  width:220px;
  height:56px;

  background:#750014;

  color:white;

  text-decoration:none;

  border-radius:50px;

  font-size:13px;
  font-weight:bold;

  letter-spacing:3px;
}

@media(max-width:768px){

  .content{
    margin-top:320px;
  }

  .button{
    width:190px;
    height:52px;
    font-size:12px;
  }

}

</style>

</head>

<body>

<section class="hero">

  <img src="capa.jpg">

  <div class="content">

    <!-- CORRIGIDO -->
    <a href="escolhas.html" class="button">
      CONTINUAR
    </a>

  </div>

</section>

</body>
</html>
