<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Polaroides</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      width:100%;
      min-height:100vh;

      background:black;

      font-family:Arial, sans-serif;

      overflow:hidden;

    }

    .hero{

      position:relative;

      width:100%;
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      overflow:hidden;

    }

    /* IMAGEM */

    .hero img{

      position:absolute;

      top:0;
      left:0;

      width:100%;
      height:100%;

      object-fit:cover;

    }

    /* CONTEÚDO */

    .content{

      position:relative;

      z-index:2;

      text-align:center;

      padding:20px;

      margin-top:280px;

    }

    /* BOTÃO */

    .button{

      display:inline-flex;

      align-items:center;
      justify-content:center;

      width:220px;
      height:56px;

      background:black;

      color:white;

      text-decoration:none;

      border-radius:50px;

      font-size:13px;
      font-weight:bold;

      letter-spacing:3px;

      transition:0.3s;

    }

    .button:hover{

      transform:translateY(-3px);

    }

    /* MOBILE */

    @media(max-width:768px){

      .content{

        margin-top:320px;

      }

      .button{

        width:190px;
        height:52px;

        font-size:12px;

      }

    }

  </style>

</head>

<body>

  <section class="hero">

    <!-- IMAGEM -->
    <img src="pagina.jpg" alt="Polaroides">

    <!-- CONTEÚDO -->
    <div class="content">

      <!-- BOTÃO -->
      <a href="#" class="button">
        INICIAR
      </a>

    </div>

  </section>

</body>

</html>
