<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Definido</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  background:url("final.jpg") no-repeat center center;
  background-size:cover;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.container{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:30px;
}

.polaroid{

  width:min(90vw,320px);

  aspect-ratio:3/4;

  background:white;

  border-radius:24px;

  overflow:hidden;

  position:relative;

  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.polaroid img{

  position:absolute;

  top:50%;
  left:50%;

  width:auto;
  height:auto;

  min-width:100%;
  min-height:100%;

  transform:translate(-50%,-50%);
}

/* 2 */
.layout-2 img{
  height:50%;
}

/* 4 */
.layout-4 img{
  width:50%;
  height:50%;
}

.buttons{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  justify-content:center;
}

button{

  width:160px;
  height:50px;

  border:none;

  border-radius:50px;

  cursor:pointer;

  letter-spacing:2px;
}

.download{
  background:#750014;
  color:white;
}

.restart{
  background:white;
  color:#750014;
}

</style>

</head>

<body>

<div class="container">

<div class="polaroid" id="polaroid">

<img id="img1_final">
<img id="img2_final">
<img id="img3_final">
<img id="img4_final">

</div>

<div class="buttons">

<button class="download"
onclick="downloadImage()">
BAIXAR
</button>

<button class="restart"
onclick="restart()">
RECOMEÇAR
</button>

</div>

</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

function init(){

  const layout =
  localStorage.getItem('polaroid');

  const polaroid =
  document.getElementById('polaroid');

  if(layout === 'Polaroid 2'){
    polaroid.classList.add('layout-1');
  }

  if(layout === 'Polaroid 3'){
    polaroid.classList.add('layout-3');
  }

  if(layout === 'Polaroid 4'){
    polaroid.classList.add('layout-4');
  }

  const ids =
  ["img1","img2","img3","img4"];

  ids.forEach(id => {

    const data =
    localStorage.getItem(id);

    const img =
    document.getElementById(id+"_final");

    if(data){

      img.src = data;

      const x =
      localStorage.getItem(id+"_x") || 0;

      const y =
      localStorage.getItem(id+"_y") || 0;

      const scale =
      localStorage.getItem(id+"_scale") || 1;

      img.style.transform =
      `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${scale})`;

    }else{

      img.style.display='none';
    }

  });

}

window.addEventListener('load',init);

function downloadImage(){

  html2canvas(
    document.getElementById('polaroid'),
    {
      scale:2,
      useCORS:true
    }
  ).then(canvas => {

    const link =
    document.createElement('a');

    link.download =
    'polaroid.png';

    link.href =
    canvas.toDataURL();

    link.click();
  });
}

function restart(){

  localStorage.clear();

  window.location.href =
  'index.html';
}

</script>

</body>
</html>
