<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Definido</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  min-height:100vh;

  background:url("final.jpg") center/cover no-repeat;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  font-family:Arial;
}

/* CONTAINER */

.container{

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:30px;
}

/* POLAROID */

.polaroid{

  position:relative;

  width:min(90vw,360px);

  aspect-ratio:3/4;
}

/* MOLDURA */

.frame{

  position:absolute;

  top:0;
  left:0;

  width:100%;
  height:100%;

  object-fit:contain;

  z-index:999;

  pointer-events:none;
}

/* ÁREAS DAS FOTOS */

.photo{

  position:absolute;

  overflow:hidden;

  z-index:2;
}

/* IMAGENS */

.photo img{

  position:absolute;

  top:50%;
  left:50%;

  width:auto;
  height:auto;

  min-width:100%;
  min-height:100%;

  max-width:none;
  max-height:none;

  transform:translate(-50%,-50%);
}

/* ========================= */
/* POLAROID 1 */
/* ========================= */

.polaroid-1 #photo1{

  top:11%;
  left:10%;

  width:80%;
  height:76%;
}

/* ========================= */
/* POLAROID 2 */
/* ========================= */

.polaroid-2 #photo1{

  top:11%;
  left:10%;

  width:80%;
  height:76%;
}

/* ========================= */
/* POLAROID 3 */
/* ========================= */

.polaroid-3 #photo1{

  top:11%;
  left:10%;

  width:80%;
  height:36%;
}

.polaroid-3 #photo2{

  top:50%;
  left:10%;

  width:38%;
  height:37%;
}

.polaroid-3 #photo3{

  top:50%;
  right:10%;

  width:38%;
  height:37%;
}

/* ========================= */
/* POLAROID 4 */
/* ========================= */

.polaroid-4 #photo1{

  top:11%;
  left:10%;

  width:38%;
  height:36%;
}

.polaroid-4 #photo2{

  top:11%;
  right:10%;

  width:38%;
  height:36%;
}

.polaroid-4 #photo3{

  bottom:13%;
  left:10%;

  width:38%;
  height:36%;
}

.polaroid-4 #photo4{

  bottom:13%;
  right:10%;

  width:38%;
  height:36%;
}

/* BOTÕES */

.buttons{

  display:flex;
  gap:15px;
}

button{

  width:160px;
  height:50px;

  border:none;

  border-radius:50px;

  cursor:pointer;

  letter-spacing:2px;
}

.download{

  background:#750014;
  color:white;
}

.restart{

  background:white;
  color:#750014;
}

/* MOBILE */

@media(max-width:768px){

  .polaroid{
    width:min(95vw,320px);
  }

  .buttons{
    flex-direction:column;
  }
}

</style>

</head>

<body>

<div class="container">

  <div
    class="polaroid"
    id="polaroid"
  >

    <!-- FOTO 1 -->
    <div class="photo" id="photo1">
      <img id="img1_final">
    </div>

    <!-- FOTO 2 -->
    <div class="photo" id="photo2">
      <img id="img2_final">
    </div>

    <!-- FOTO 3 -->
    <div class="photo" id="photo3">
      <img id="img3_final">
    </div>

    <!-- FOTO 4 -->
    <div class="photo" id="photo4">
      <img id="img4_final">
    </div>

    <!-- MOLDURA -->
    <img
      class="frame"
      id="frame"
      crossorigin="anonymous"
    >

  </div>

  <div class="buttons">

    <button
      class="download"
      onclick="downloadImage()"
    >
      BAIXAR
    </button>

    <button
      class="restart"
      onclick="restart()"
    >
      RECOMEÇAR
    </button>

  </div>

</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

function init(){

  const selected =
  localStorage.getItem('polaroid');

  const polaroid =
  document.getElementById('polaroid');

  const frame =
  document.getElementById('frame');

  /* DEFINE CLASSE + PNG */

  if(selected === 'Polaroid 1'){

    polaroid.classList.add('polaroid-1');

    frame.src = 'polaroid1.png';
  }

  if(selected === 'Polaroid 2'){

    polaroid.classList.add('polaroid-2');

    frame.src = 'polaroid2.png';

    document.getElementById('photo2').style.display='none';
    document.getElementById('photo3').style.display='none';
    document.getElementById('photo4').style.display='none';
  }

  if(selected === 'Polaroid 3'){

    polaroid.classList.add('polaroid-3');

    frame.src = 'polaroid3.png';

    document.getElementById('photo4').style.display='none';
  }

  if(selected === 'Polaroid 4'){

    polaroid.classList.add('polaroid-4');

    frame.src = 'polaroid4.png';
  }

  /* CARREGA FOTOS */

  const ids =
  ['img1','img2','img3','img4'];

  ids.forEach(id => {

    const data =
    localStorage.getItem(id);

    const img =
    document.getElementById(id+'_final');

    if(data){

      img.src = data;

      const x =
      localStorage.getItem(id+'_x') || 0;

      const y =
      localStorage.getItem(id+'_y') || 0;

      const scale =
      localStorage.getItem(id+'_scale') || 1;

      img.style.transform =
      `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${scale})`;

    }

  });

}

window.addEventListener('load', init);

/* DOWNLOAD */

function downloadImage(){

  const frame =
  document.getElementById('frame');

  function gerarDownload(){

    html2canvas(
      document.getElementById('polaroid'),
      {
        scale:3,
        useCORS:true,
        allowTaint:true,
        backgroundColor:null
      }
    ).then(canvas => {

      const link =
      document.createElement('a');

      link.download =
      'polaroid-charry.png';

      link.href =
      canvas.toDataURL('image/png');

      link.click();

    });

  }

  if(frame.complete){

    gerarDownload();

  }else{

    frame.onload =
    gerarDownload;

  }

}

/* RESET */

function restart(){

  localStorage.clear();

  window.location.href =
  'index.html';
}

</script>

</body>
</html>
