<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Definido</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  min-height:100vh;

  background:url("final.jpg") no-repeat center center;

  background-size:cover;

  font-family:Arial,sans-serif;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;
}

/* CONTAINER */

.container{

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:35px;
}

/* POLAROID */

.polaroid-wrapper{

  position:relative;

  width:min(90vw,360px);

  aspect-ratio:3/4;
}

/* ÁREA DA FOTO */

.photo-layer{

  position:absolute;

  /* 🔥 AJUSTE DA ÁREA INTERNA */
  top:8%;
  left:8%;

  width:84%;
  height:67%;

  overflow:hidden;

  z-index:2;

  border-radius:8px;
}

/* FOTO */

.photo-layer img{

  position:absolute;

  top:50%;
  left:50%;

  width:auto;
  height:auto;

  min-width:100%;
  min-height:100%;

  max-width:none;
  max-height:none;

  transform:translate(-50%,-50%) scale(1);

  object-fit:cover;
}

/* MOLDURA */

.polaroid-frame{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;

  z-index:5;

  pointer-events:none;
}

/* BOTÕES */

.buttons{

  display:flex;

  gap:15px;

  flex-wrap:wrap;

  justify-content:center;
}

button{

  width:160px;
  height:50px;

  border:none;

  border-radius:50px;

  cursor:pointer;

  font-size:12px;

  letter-spacing:3px;
}

.download{

  background:#750014;

  color:white;
}

.restart{

  background:white;

  color:#750014;
}

/* MOBILE */

@media(max-width:768px){

  .polaroid-wrapper{

    width:min(92vw,320px);
  }

  button{

    width:145px;
    height:48px;
  }

}

</style>

</head>

<body>

<div class="container">

  <!-- POLAROID -->
  <div
    class="polaroid-wrapper"
    id="polaroid"
  >

    <!-- FOTO -->
    <div class="photo-layer">

      <img id="img1_final">
      <img id="img2_final">
      <img id="img3_final">
      <img id="img4_final">

    </div>

    <!-- MOLDURA -->
    <img
      class="polaroid-frame"
      id="frame"
    >

  </div>

  <!-- BOTÕES -->
  <div class="buttons">

    <button
      class="download"
      onclick="downloadImage()"
    >
      BAIXAR
    </button>

    <button
      class="restart"
      onclick="restart()"
    >
      RECOMEÇAR
    </button>

  </div>

</div>

<!-- HTML2CANVAS -->

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

/* INICIAR */

function init(){

  const selected =
  localStorage.getItem('polaroid');

  const frame =
  document.getElementById('frame');

  /* DEFINE A POLAROID */

  if(selected === 'Polaroid 1'){
    frame.src = 'polaroid1.png';
  }

  if(selected === 'Polaroid 2'){
    frame.src = 'polaroid2.png';
  }

  if(selected === 'Polaroid 3'){
    frame.src = 'polaroid3.png';
  }

  if(selected === 'Polaroid 4'){
    frame.src = 'polaroid4.png';
  }

  /* CARREGA AS IMAGENS */

  const ids =
  ['img1','img2','img3','img4'];

  ids.forEach(id => {

    const data =
    localStorage.getItem(id);

    const img =
    document.getElementById(id + '_final');

    if(data){

      img.src = data;

      /* AJUSTES SALVOS */

      const x =
      localStorage.getItem(id+'_x') || 0;

      const y =
      localStorage.getItem(id+'_y') || 0;

      const scale =
      localStorage.getItem(id+'_scale') || 1;

      img.style.transform =
      `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${scale})`;

    }else{

      img.style.display='none';
    }

  });

}

window.addEventListener('load', init);

/* DOWNLOAD */

function downloadImage(){

  const element =
  document.getElementById('polaroid');

  html2canvas(element, {

    scale:3,

    useCORS:true,

    backgroundColor:null

  }).then(canvas => {

    const link =
    document.createElement('a');

    link.download =
    'polaroid-charry.png';

    link.href =
    canvas.toDataURL('image/png');

    link.click();

  });

}

/* RECOMEÇAR */

function restart(){

  localStorage.clear();

  window.location.href =
  'index.html';
}

</script>

</body>
</html>
