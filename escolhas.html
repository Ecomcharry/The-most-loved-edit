<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Escolhas</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:white;
  font-family:Arial,sans-serif;
  min-height:100vh;
  padding:60px 20px;
}

.container{
  max-width:1400px;
  margin:0 auto;
  text-align:center;
}

h1{
  font-size:42px;
  font-weight:300;
  margin-bottom:70px;
}

.polaroids{
  display:flex;
  justify-content:center;
  gap:25px;
  flex-wrap:wrap;
  margin-bottom:50px;
}

.polaroid{
  width:min(220px,45vw);
  cursor:pointer;
  transition:0.3s;
  border:3px solid transparent;
}

.polaroid img{
  width:100%;
  display:block;
}

.polaroid.active{
  transform:scale(1.05);
}

.button{

  width:220px;
  height:56px;

  border:none;

  border-radius:50px;

  background:black;

  color:white;

  letter-spacing:3px;

  font-size:12px;

  cursor:pointer;
}

@media(max-width:768px){

  h1{
    font-size:30px;
    margin-bottom:40px;
  }

}

</style>

</head>

<body>

<div class="container">

  <h1>Escolha sua polaroid</h1>

  <div class="polaroids">

    <div class="polaroid" onclick="selectPolaroid(this,'Polaroid 1')">
      <img src="polaroid1.png">
    </div>

    <div class="polaroid" onclick="selectPolaroid(this,'Polaroid 2')">
      <img src="polaroid2.png">
    </div>

    <div class="polaroid" onclick="selectPolaroid(this,'Polaroid 3')">
      <img src="polaroid3.png">
    </div>

    <div class="polaroid" onclick="selectPolaroid(this,'Polaroid 4')">
      <img src="polaroid4.png">
    </div>

  </div>

  <button class="button" onclick="goToEditor()">
    CONTINUAR
  </button>

</div>

<script>

let selectedPolaroid = '';

function selectPolaroid(element,name){

  document.querySelectorAll('.polaroid')
  .forEach(item => item.classList.remove('active'));

  element.classList.add('active');

  selectedPolaroid = name;
}

function goToEditor(){

  if(selectedPolaroid === ''){

    alert('Escolha uma polaroid');
    return;

  }

  localStorage.setItem('polaroid', selectedPolaroid);

  window.location.href = 'editor.html';
}

</script>

</body>
</html>
