<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Escolhas</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      width:100%;
      min-height:100vh;

      background:white;

      font-family:Arial, sans-serif;

      padding:60px 20px;

    }

    .container{

      width:100%;
      max-width:1200px;

      margin:0 auto;

      text-align:center;

    }

    h1{

      font-size:38px;

      font-weight:300;

      margin-bottom:50px;

      letter-spacing:2px;

      color:black;

    }

    /* GRID DAS POLAROIDS */

    .polaroids{

      display:grid;

      grid-template-columns:repeat(2, 1fr);

      gap:30px;

      margin-bottom:50px;

    }

    .polaroid{

      background:white;

      border-radius:12px;

      overflow:hidden;

      transition:0.3s;

      cursor:pointer;

    }

    .polaroid:hover{

      transform:translateY(-5px);

    }

    .polaroid img{

      width:100%;

      display:block;

      object-fit:cover;

    }

    /* CAMPO */

    .field{

      max-width:400px;

      margin:0 auto 30px auto;

      text-align:left;

    }

    .field label{

      display:block;

      margin-bottom:12px;

      font-size:14px;

      letter-spacing:2px;

      color:black;

    }

    select{

      width:100%;

      height:58px;

      padding:0 20px;

      border-radius:50px;

      border:1px solid #d9d9d9;

      font-size:15px;

      outline:none;

      background:white;

    }

    /* BOTÃO */

    .button{

      display:inline-flex;

      align-items:center;
      justify-content:center;

      width:220px;
      height:56px;

      background:black;

      color:white;

      text-decoration:none;

      border-radius:50px;

      font-size:13px;
      font-weight:bold;

      letter-spacing:3px;

      transition:0.3s;

    }

    .button:hover{

      transform:translateY(-3px);

    }

    /* MOBILE */

    @media(max-width:768px){

      h1{

        font-size:28px;

      }

      .polaroids{

        grid-template-columns:1fr;

        gap:20px;

      }

      .button{

        width:190px;
        height:52px;

        font-size:12px;

      }

    }

  </style>

</head>

<body>

  <div class="container">

    <h1>Escolha sua polaroid</h1>

    <!-- POLAROIDS -->

    <div class="polaroids">

      <div class="polaroid">
        <img src="polaroid1.jpg" alt="Polaroid 1">
      </div>

      <div class="polaroid">
        <img src="polaroid2.jpg" alt="Polaroid 2">
      </div>

      <div class="polaroid">
        <img src="polaroid3.jpg" alt="Polaroid 3">
      </div>

      <div class="polaroid">
        <img src="polaroid4.jpg" alt="Polaroid 4">
      </div>

    </div>

    <!-- ESCOLHA -->

    <div class="field">

      <label>ESCOLHA SUA POLAROID</label>

      <select>

        <option>Polaroid 1</option>
        <option>Polaroid 2</option>
        <option>Polaroid 3</option>
        <option>Polaroid 4</option>

      </select>

    </div>

    <!-- BOTÃO -->

    <a href="#" class="button">
      CONTINUAR
    </a>

  </div>

</body>

</html>
