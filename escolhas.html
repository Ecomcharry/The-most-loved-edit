<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Escolhas</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      width:100%;
      min-height:100vh;

      background:white;

      font-family:Arial, sans-serif;

      padding:60px 20px;

    }

    .container{

      width:100%;
      max-width:1200px;

      margin:0 auto;

      text-align:center;

    }

    h1{

      font-size:38px;

      font-weight:300;

      margin-bottom:50px;

      letter-spacing:2px;

      color:black;

    }

    /* GRID */

    .polaroids{

      display:grid;

      grid-template-columns:repeat(2, 1fr);

      gap:30px;

      margin-bottom:50px;

    }

    /* POLAROID */

    .polaroid{

      border:3px solid transparent;

      border-radius:16px;

      overflow:hidden;

      cursor:pointer;

      transition:0.3s;

    }

    .polaroid img{

      width:100%;

      display:block;

    }

    .polaroid:hover{

      transform:translateY(-5px);

    }

    /* ATIVA */

    .polaroid.active{

      border:3px solid black;

      transform:scale(1.02);

    }

    /* TEXTO */

    .selected{

      margin-bottom:30px;

      font-size:16px;

      letter-spacing:1px;

      color:black;

    }

    /* BOTÃO */

    .button{

      display:inline-flex;

      align-items:center;
      justify-content:center;

      width:220px;
      height:56px;

      background:black;

      color:white;

      text-decoration:none;

      border-radius:50px;

      font-size:13px;
      font-weight:bold;

      letter-spacing:3px;

      border:none;

      cursor:pointer;

      transition:0.3s;

    }

    .button:hover{

      transform:translateY(-3px);

    }

    /* MOBILE */

    @media(max-width:768px){

      h1{

        font-size:28px;

      }

      .polaroids{

        grid-template-columns:1fr;

      }

      .button{

        width:190px;
        height:52px;

        font-size:12px;

      }

    }

  </style>

</head>

<body>

  <div class="container">

    <h1>Escolha sua polaroid</h1>

    <!-- POLAROIDS -->

    <div class="polaroids">

      <div class="polaroid" onclick="selectPolaroid(this, 'Polaroid 1')">
        <img src="polaroid1.jpg" alt="Polaroid 1">
      </div>

      <div class="polaroid" onclick="selectPolaroid(this, 'Polaroid 2')">
        <img src="polaroid2.jpg" alt="Polaroid 2">
      </div>

      <div class="polaroid" onclick="selectPolaroid(this, 'Polaroid 3')">
        <img src="polaroid3.jpg" alt="Polaroid 3">
      </div>

      <div class="polaroid" onclick="selectPolaroid(this, 'Polaroid 4')">
        <img src="polaroid4.jpg" alt="Polaroid 4">
      </div>

    </div>

    <!-- TEXTO -->

    <p class="selected" id="selectedText">
      Nenhuma polaroid selecionada
    </p>

    <!-- BOTÃO -->

    <button class="button">
      CONTINUAR
    </button>

  </div>

  <script>

    function selectPolaroid(element, name){

      // remove ativa das outras

      document.querySelectorAll('.polaroid').forEach(item => {
        item.classList.remove('active');
      });

      // adiciona ativa

      element.classList.add('active');

      // muda texto

      document.getElementById('selectedText').innerText =
        name + ' selecionada';

    }

  </script>

</body>

</html>
