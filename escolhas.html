<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Escolhas</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      width:100%;
      min-height:100vh;

      background:white;

      font-family:Arial, sans-serif;

      padding:60px 20px;

    }

    .container{

      width:100%;
      max-width:1400px;

      margin:0 auto;

      text-align:center;

    }

    h1{

      font-size:42px;

      font-weight:300;

      margin-bottom:70px;

      letter-spacing:2px;

      color:black;

    }

    /* POLAROIDS */

    .polaroids{

      display:flex;

      justify-content:center;

      align-items:flex-start;

      gap:25px;

      margin-bottom:60px;

      flex-wrap:wrap;

    }

    .polaroid{

      width:220px;

      cursor:pointer;

      transition:0.3s;

      border:3px solid transparent;

      background:none;

      padding:0;

      box-shadow:none;

    }

    /* ROTAÇÕES */

    .polaroid:nth-child(1){

      transform:rotate(-6deg);

    }

    .polaroid:nth-child(2){

      transform:rotate(4deg);

    }

    .polaroid:nth-child(3){

      transform:rotate(-3deg);

    }

    .polaroid:nth-child(4){

      transform:rotate(5deg);

    }

    .polaroid img{

      width:100%;

      display:block;

    }

    .polaroid:hover{

      transform:scale(1.04) rotate(0deg);

    }

    /* ATIVA */

    .polaroid.active{

      transform:scale(1.08) rotate(0deg);

    }

    /* TEXTO */

    .selected{

      margin-bottom:35px;

      font-size:16px;

      letter-spacing:1px;

      color:black;

    }

    /* BOTÃO */

    .button{

      display:inline-flex;

      align-items:center;
      justify-content:center;

      width:220px;
      height:56px;

      background:black;

      color:white;

      text-decoration:none;

      border-radius:50px;

      font-size:13px;
      font-weight:bold;

      letter-spacing:3px;

      border:none;

      cursor:pointer;

      transition:0.3s;

    }

    .button:hover{

      transform:translateY(-3px);

    }

    /* MOBILE */

    @media(max-width:768px){

      body{

        padding:40px 20px;

      }

      h1{

        font-size:30px;

        margin-bottom:50px;

      }

      .polaroids{

        flex-direction:column;

        align-items:center;

      }

      .polaroid{

        width:240px;

      }

      .button{

        width:190px;
        height:52px;

        font-size:12px;

      }

    }

  </style>

</head>

<body>

  <div class="container">

    <h1>Escolha sua polaroid</h1>

    <!-- POLAROIDS -->

    <div class="polaroids">

      <div class="polaroid" onclick="selectPolaroid(this, 'Polaroid 1')">
        <img src="polaroid1.png" alt="Polaroid 1">
      </div>

      <div class="polaroid" onclick="selectPolaroid(this, 'Polaroid 2')">
        <img src="polaroid2.png" alt="Polaroid 2">
      </div>

      <div class="polaroid" onclick="selectPolaroid(this, 'Polaroid 3')">
        <img src="polaroid3.png" alt="Polaroid 3">
      </div>

      <div class="polaroid" onclick="selectPolaroid(this, 'Polaroid 4')">
        <img src="polaroid4.png" alt="Polaroid 4">
      </div>

    </div>

    <!-- TEXTO -->

    <p class="selected" id="selectedText">
      Nenhuma polaroid selecionada
    </p>

    <!-- BOTÃO -->

    <button class="button">
      CONTINUAR
    </button>

  </div>

  <script>

    function selectPolaroid(element, name){

      // remove ativa das outras

      document.querySelectorAll('.polaroid').forEach(item => {
        item.classList.remove('active');
      });

      // adiciona ativa

      element.classList.add('active');

      // muda texto

      document.getElementById('selectedText').innerText =
        name + ' selecionada';

    }

  </script>

</body>

</html>
